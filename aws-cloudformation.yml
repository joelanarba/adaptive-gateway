AWSTemplateFormatVersion: '2010-09-09'
Description: 'Adaptive Gateway host scaffold; requires reviewed secrets/TLS before startup'

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance type. AWS resources may incur charges.

  SSHLocation:
    Type: String
    Default: 127.0.0.1/32
    Description: Operator CIDR allowed to SSH; replace with your own public IP/32.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Optional. Name of an existing EC2 KeyPair to enable SSH access to the instance.
    Default: ''

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:
  AdaptiveGatewaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP and dashboard traffic for Adaptive Gateway
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Nginx / Main proxy endpoint
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: TLS front door after operator configuration
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
          Description: SSH Access

  AdaptiveGatewayInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      SecurityGroups:
        - !Ref AdaptiveGatewaySecurityGroup
      # Amazon Linux 2023 AMI (x86_64) - dynamically fetched
      ImageId: !Ref LatestAmiId
      MetadataOptions:
        HttpTokens: required
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          # Update OS and install Git and Docker
          dnf update -y
          dnf install -y git docker
          
          # Start Docker daemon
          systemctl enable docker
          systemctl start docker
          usermod -aG docker ec2-user
          
          # Install Docker Compose plugin
          mkdir -p /usr/local/lib/docker/cli-plugins/
          curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          # Alias docker-compose
          ln -s /usr/local/lib/docker/cli-plugins/docker-compose /usr/bin/docker-compose

          # Clone Repository
          cd /home/ec2-user
          git clone https://github.com/joelanarba/adaptive-gateway.git
          cd adaptive-gateway
          
          # Deliberately do not copy sample credentials or start public services.
          # The operator must configure secrets, migrations and TLS first.
          
          # Fix ownership so ec2-user can access it
          chown -R ec2-user:ec2-user /home/ec2-user/adaptive-gateway

          # See docs/SECURITY.md before applying the production Compose overlay.

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref AdaptiveGatewayInstance
  Hostname:
    Description: Host scaffold only. Configure TLS/secrets/migrations before startup.
    Value: !GetAtt AdaptiveGatewayInstance.PublicDnsName
